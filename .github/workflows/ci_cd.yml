name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  BUILD_DIR: "dist"

jobs:
  # 1. Job do kompilacji/budowy
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Zaktualizowano z v3 na v4

      - name: Setup Node.js
        uses: actions/setup-node@v4  # Upewniamy się, że jest v4
        with:
          node-version: '20' # Tutaj definiujesz wersję dla swojej aplikacji (może być 20 lub nowsza)
          cache: 'npm'

      - name: Install and Run Application
        run: |
          echo "Instalowanie zależności dla środowiska: $ENVIRONMENT"
          npm install
          
          echo "Uruchamianie aplikacji testowej..."
          mkdir -p ${{ env.BUILD_DIR }}
          npm start > ${{ env.BUILD_DIR }}/app-bundle.txt

      # Zapisywanie artefaktów TYLKO dla gałęzi main
      - name: Upload Build Artifacts (Main Only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4  # Upewniamy się, że jest v4
        with:
          name: production-build
          path: ${{ env.BUILD_DIR }}/
          retention-days: 7

  # 2. Job do testowania
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Zaktualizowano z v3 na v4

      - name: Run Unit Tests
        run: |
          echo "Uruchamianie testów..."
          npm install
          npm test

  # 3. Job do wdrażania (tylko dla main branch)
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Zaktualizowano z v3 na v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4  # Upewniamy się, że jest v4
        with:
          name: production-build
          path: ./downloaded-artifacts

      - name: Execute Deployment
        run: |
          echo "Wdrażanie aplikacji na serwer produkcyjny..."
          cat ./downloaded-artifacts/app-bundle.txt
          echo "Wdrożenie zakończone sukcesem."

  # 4. Raportowanie statusu na koniec
  status_report:
    name: Status Report
    runs-on: ubuntu-latest
    needs: [build, test, deploy]
    if: always()
    steps:
      - name: Check Pipeline Status
        run: |
          echo "========================================="
          echo "        PODSUMOWANIE PIPELINE'U          "
          echo "========================================="
          echo "Status Job'u Build:  ${{ needs.build.result }}"
          echo "Status Job'u Test:   ${{ needs.test.result }}"
          echo "Status Job'u Deploy: ${{ needs.deploy.result || 'SKIPPED (Not main branch)' }}"
          echo "========================================="
