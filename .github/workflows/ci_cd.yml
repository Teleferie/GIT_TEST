name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  BUILD_DIR: "dist"

jobs:
  # 1. Job do kompilacji/budowy
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (Przykładowe środowisko)
        uses: actions/setup-node@v4
        with:
          node-modules-cache: 'npm'

      - name: Install dependencies
        run: |
          echo "Instalowanie zależności dla środowiska: $ENVIRONMENT"
          # npm ci (symulacja)
          mkdir -p ${{ env.BUILD_DIR }}
          echo "Kompilacja zakończona sukcesem" > ${{ env.BUILD_DIR }}/app-bundle.txt

      # Warunkowy krok przy użyciu if statement: Zapisywanie artefaktów TYLKO dla gałęzi main
      - name: Upload Build Artifacts (Main Only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: ${{ env.BUILD_DIR }}/
          retention-days: 7

  # 2. Job do testowania
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          echo "Uruchamianie testów jednostkowych..."
          # npm test (symulacja)
          echo "[PASSED] Testy jednostkowe wykonane."

      - name: Run Integration Tests
        if: env.ENVIRONMENT == 'production'
        run: |
          echo "Uruchamianie dodatkowych testów integracyjnych dla produktywnego main..."

  # 3. Job do wdrażania (tylko dla main branch)
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: test
    # Warunek dla całego job'u - uruchomienie TYLKO na push do main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: ./downloaded-artifacts

      - name: Execute Deployment
        run: |
          echo "Wdrażanie aplikacji na serwer produkcyjny..."
          cat ./downloaded-artifacts/app-bundle.txt
          echo "Wdrożenie zakończone."

  # 4. Raportowanie statusu na koniec
  status_report:
    name: Status Report
    runs-on: ubuntu-latest
    needs: [build, test, deploy]
    if: always() # Uruchamia się zawsze, niezależnie od wyników poprzednich kroków
    steps:
      - name: Check Pipeline Status
        run: |
          echo "========================================="
          echo "        PODSUMOWANIE PIPELINE'U          "
          echo "========================================="
          echo "Status Job'u Build:  ${{ needs.build.result }}"
          echo "Status Job'u Test:   ${{ needs.test.result }}"
          echo "Status Job'u Deploy: ${{ needs.deploy.result || 'SKIPPED (Not main branch)' }}"
          echo "========================================="
